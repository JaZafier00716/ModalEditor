# User motion bindings for ModalEditor.
# Edit this file to customize motions.
# Use `--default` to ignore this file and load `motions.default.conf` instead.
# Normal-mode commands like `i`, `a`, `A`, `I`, `:`, `d`, and `y` stay command keys when typed on their own.

h = left
j = down
k = up
l = right
0 = line_start
$ = line_end
gg = file_start
G = file_end
w = word_forward
W = word_forward_big
b = word_backward
B = word_backward_big
e = word_end
E = word_end_big
H = screen_top
M = screen_middle
L = screen_bottom
{ = paragraph_backward
} = paragraph_forward
% = matching_bracket
& = matching_brace

ArrowUp = up
ArrowDown = down
ArrowLeft = left
ArrowRight = right
PageUp = page_up
PageDown = page_down
Home = line_start
End = line_end
